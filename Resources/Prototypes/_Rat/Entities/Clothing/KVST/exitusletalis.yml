- type: entity
  parent: [ClothingOuterHardsuitBase, BaseIntegratedManeuveringThrusters] 
  id: ClothingOuterHardsuitInterdyneExitusLetalis
  name: interdyne Exitus Letalis Hardsuit
  description: A modular hardsuit produced by Shinohara Heavy Industries, made for Interdyne TraumaSec officers.
  components:
  - type: Sprite
    sprite: _Crescent/Clothing/Syndicate/OuterClothing/trauma_suit.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Syndicate/OuterClothing/trauma_suit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 1
  - type: DegradeableArmor
    armorMaxHealth: 925
    armorType: Ceramic
    armorRepair: NTCeramic
    initialModifiers:
      flatReductions:
        Blunt: 25
        Slash: 25
        Piercing: 65
        Heat: 30
        Caustic: 100
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitTraumasec
  - type: Contraband
    value: 5
  - type: ClothingAddFaction
    faction: TFSC
  - type: ClothingGrantComponent
    component:
    - type: DamageOverTime
      damage:
        types:
          Blunt: -0.6
          Piercing: -0.6
          Slash: -0.6
          Heat: -0.6
          Radiation: -0.3
      interval: 1.0
      ignoreResistances: true
  - type: ReverseEngineering # Sector Crescent
    recipes:
      - ClothingOuterHardsuitTraumasec


- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: ClothingHeadHelmetHardsuitExitusLetalis
  categories: [ HideSpawnMenu ]
  name: interdyne exitus letalis hardsuit helmet
  description: Spaceworthy protection for your fragile skull.
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Crescent/Clothing/Syndicate/Head/trauma_helmet.rsi
  - type: Clothing
    sprite: _Crescent/Clothing/Syndicate/Head/trauma_helmet.rsi
  - type: PointLight
    radius: 5
    color: "#d96050"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Radiation: 0.9
        Caustic: 0.9